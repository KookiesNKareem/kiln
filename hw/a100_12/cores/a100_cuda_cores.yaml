name: a100_cuda_cores
type: zigzag.compute

memories:
  # Vector registers: 64 VREGs of (8, 128) x 32 bit ~= 256 KB per core.
  vregs:
    size: 2097152
    r_cost: 0.05
    w_cost: 0.05
    area: 0
    latency: 1
    operands: [I1, I2, O]
    ports:
      - name: rw_port_1
        type: read_write
        bandwidth_min: 512
        bandwidth_max: 52131
        allocation:
          - I1, tl
          - I2, tl
          - O, tl
          - O, th
      - name: rw_port_2
        type: read_write
        bandwidth_min: 512
        bandwidth_max: 52131
        allocation:
          - I1, fh
          - I2, fh
          - O, fh
          - O, fl
    served_dimensions: [D1, D2]

  # Array-local operand staging (2 MiB): the shared 64 MiB VMEM lives on tpu_v7_vmem.yaml, reached
  # over the intra-TensorCore bus. Kept small so it stays a staging FIFO, not a second scratchpad.
  # Port width is the VMEM feed bandwidth at 1.1 GHz.
  operand_buffer:
    size: 16777216
    r_cost: 120
    w_cost: 130
    area: 0
    latency: 1
    operands: [I1, I2, O]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 256
        bandwidth_max: 40960
        allocation:
          - I1, tl
          - I2, tl
          - O, tl
          - O, th
      - name: w_port_1
        type: write
        bandwidth_min: 256
        bandwidth_max: 40960
        allocation:
          - I1, fh
          - I2, fh
          - O, fh
          - O, fl
    served_dimensions: [D1, D2]

operational_array:
  unit_energy: 0.06 # pJ per vector op
  unit_area: 0.05
  dimensions: [D1, D2]
  sizes: [27, 64]

operand_precision:
  input: fp32
  accumulator: fp32

operator_types: [Add, Sub, Mul, Div, Exp, Pow, Silu, Sigmoid, Gelu, Tanh, Relu, Softmax, ReduceMax, ReduceSum, ReduceMean, MaxPool, AveragePool, GlobalAveragePool, GlobalMaxPool]
