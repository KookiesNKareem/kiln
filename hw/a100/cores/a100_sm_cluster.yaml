name: a100_sm_cluster
type: zigzag.compute

memories:
  # Weight registers: one per PE, held stationary for the duration of a tile.
  # 65536 PEs x 32 bit = 2 Mbit.
  wreg:
    size: 32
    r_cost: 0.02
    w_cost: 0.02
    area: 0
    latency: 1
    auto_cost_extraction: False
    operands: [I2]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 16
        bandwidth_max: 16
        allocation:
          - I2, tl
      - name: w_port_1
        type: write
        bandwidth_min: 16
        bandwidth_max: 16
        allocation:
          - I2, fh
    served_dimensions: []

  # fp32 accumulator per array column: partial sums walk down D2. Width is array-inherent (256
  # columns x 32 bit), so it does not scale with the core clock.
  accumulator:
    size: 3072
    r_cost: 0.01
    w_cost: 0.01
    area: 0
    latency: 1
    operands: [O]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 3072
        bandwidth_max: 3072
        allocation:
          - O, tl
      - name: r_port_2
        type: read
        bandwidth_min: 3072
        bandwidth_max: 3072
        allocation:
          - O, th
      - name: w_port_1
        type: write
        bandwidth_min: 3072
        bandwidth_max: 3072
        allocation:
          - O, fh
      - name: w_port_2
        type: write
        bandwidth_min: 3072
        bandwidth_max: 3072
        allocation:
          - O, fl
    served_dimensions: [D2]

  # Array-local operand staging (the register files plus a small operand FIFO), 2 MiB. It is
  # deliberately small: the TensorCore's 64 MiB working set lives on the shared VMEM core
  # (tpu_v7_vmem.yaml), reached over the intra-TensorCore bus, and keeping this buffer to a
  # steady-state tile stops it from becoming a second scratchpad that would hide the VMEM limit.
  # Port width is the VMEM feed bandwidth, re-derived at 1.1 GHz to preserve ~57 TB/s per TensorCore.
  operand_buffer:
    size: 24772608
    r_cost: 120
    w_cost: 130
    area: 0
    latency: 1
    operands: [I1, I2, O]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 256
        bandwidth_max: 27648
        allocation:
          - I1, tl
          - I2, tl
          - O, tl
          - O, th
      - name: w_port_1
        type: write
        bandwidth_min: 256
        bandwidth_max: 27648
        allocation:
          - I1, fh
          - I2, fh
          - O, fh
          - O, fl
    served_dimensions: [D1, D2]

operational_array:
  unit_energy: 0.02 # pJ per bf16 MAC
  unit_area: 1
  dimensions: [D1, D2]
  sizes: [72, 96]

operand_precision:
  input: bf16
  accumulator: fp32

operator_types: [MatMul, Gemm, Conv, Einsum]
