[package]
name = "kiln-viz"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
kiln-trace = { path = "../kiln-trace" }
kiln-viz-render = { path = "../kiln-viz-render" }
serde_json.workspace = true
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"], optional = true }
tiny-skia = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"], optional = true }

[features]
# The eframe/wgpu app. Off by default: without it this crate only holds the GUI-free app state, so
# `cargo test --workspace` does not build winit, wgpu or the platform windowing stack.
gui = ["dep:eframe", "dep:notify", "dep:tiny-skia"]

[dev-dependencies]
kiln-trace = { path = "../kiln-trace" }

[lints]
workspace = true
